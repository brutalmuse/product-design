<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../js/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="../js/image-slot.js"></script>
<script src="../js/cursor-dot.js"></script>
<style>
  html, body { margin:0; padding:0; box-sizing:border-box; cursor:none; }
  *, *::before, *::after { box-sizing:inherit; }
  a, button, [draggable="true"], [role="button"] { cursor:none; }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }
  @media (max-width:700px) {
    [style*="grid-template-columns: 120px 1fr"] { grid-template-columns:1fr !important; gap:8px !important; }
  }
  @keyframes hcc-in { from { opacity:0; transform:translateY(32px); } to { opacity:1; transform:translateY(0); } }
</style>
</helmet>

<div style="min-height:100vh; width:100%; background:oklch(0.985 0.002 90); color:oklch(0.12 0 0); font-family:Helvetica,Arial,sans-serif;">
  <div style="max-width:1400px; margin:0 auto; padding:clamp(16px,2.4vh,28px) clamp(20px,3vw,40px) clamp(60px,8vh,100px);">

    <header style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-bottom:clamp(16px,2.4vh,28px); border-bottom:1px solid oklch(0.12 0 0); animation:hcc-in 1.4s cubic-bezier(0.16,1,0.3,1) both;">
      <a href="../index.html" style="display:flex; align-items:center; gap:10px; color:inherit; text-decoration:none; font-weight:700; font-size:clamp(16px,1.6vw,20px); letter-spacing:-0.8px;" style-hover="color:oklch(0.75 0.22 40);" style-focus="outline:2px solid currentColor; outline-offset:3px;">
        <span aria-hidden="true">←</span> Brutal Muse.
      </a>
      <span style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:oklch(0.4 0 0);">03 — Emerging Intelligence</span>
      <nav style="display:flex; gap:18px; font-size:12px; letter-spacing:0.05em; text-transform:uppercase;">
        <a href="https://www.linkedin.com/in/shruthi" target="_blank" rel="noopener noreferrer" style="color:inherit; text-decoration:none; border-bottom:1px solid transparent;" style-hover="border-bottom-color:oklch(0.75 0.22 40); color:oklch(0.75 0.22 40);" style-focus="outline:2px solid currentColor; outline-offset:3px;">LinkedIn ↗</a>
        <a href="mailto:hello@brutalmuse.studio" style="color:inherit; text-decoration:none; border-bottom:1px solid transparent;" style-hover="border-bottom-color:oklch(0.75 0.22 40); color:oklch(0.75 0.22 40);" style-focus="outline:2px solid currentColor; outline-offset:3px;">Email ↗</a>
      </nav>
    </header>

    <div style="max-width:640px; padding:clamp(20px,3.2vh,36px) 0 clamp(24px,4vh,48px); animation:hcc-in 1.4s cubic-bezier(0.16,1,0.3,1) both; animation-delay:0.2s;">
      <h1 style="margin:0 0 10px; font-weight:300; font-size:clamp(28px,4vw,44px); letter-spacing:-0.01em; line-height:1.05;">Emerging Intelligence</h1>
    </div>

    <div style="display:flex; flex-direction:column;">
      <sc-for list="{{ projects }}" as="proj" hint-placeholder-count="1">
        <a href="{{ proj.route }}" style="display:block; text-decoration:none; color:inherit; border-top:1px solid oklch(0.12 0 0); width:100vw; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw); animation:hcc-in 1.4s cubic-bezier(0.16,1,0.3,1) both; animation-delay:calc(0.4s + {{ $index }} * 0.2s); transition:background 0.5s cubic-bezier(0.16,1,0.3,1);" style-hover="background:oklch(0.12 0 0);">
          <div style="max-width:1400px; margin:0 auto; padding:clamp(24px,3.6vh,40px) clamp(20px,3vw,40px); display:grid; grid-template-columns:120px 1fr; align-items:center; gap:clamp(20px,3vw,40px); transition:transform 0.5s cubic-bezier(0.16,1,0.3,1);" style-hover="transform:translateX(14px);">
            <span style="font-size:14px; letter-spacing:0.05em; color:oklch(0.4 0 0); font-variant-numeric:tabular-nums; transition:color 0.5s ease;" style-hover="color:oklch(0.65 0 0);">{{ proj.number }}</span>
            <div style="display:flex; flex-direction:column; gap:10px; min-width:0;">
              <h2 style="margin:0; font-weight:300; font-size:clamp(22px,2.6vw,34px); letter-spacing:-0.01em; line-height:1.1; transition:color 0.5s ease;" style-hover="color:oklch(1 0 0);">{{ proj.title }}</h2>
              <p style="margin:0; max-width:52ch; font-size:14px; line-height:1.5; color:oklch(0.3 0 0); transition:color 0.5s ease;" style-hover="color:oklch(0.8 0 0);">{{ proj.oneLiner }}</p>
              <div style="display:flex; gap:18px; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:oklch(0.45 0 0); transition:color 0.5s ease;" style-hover="color:oklch(0.6 0 0);">
                <span>{{ proj.type }}</span>
                <span>{{ proj.role }}</span>
              </div>
            </div>
          </div>
        </a>
      </sc-for>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() {
    return {
      projects: [
        {
          number: '01',
          title: 'The Slow Garden',
          oneLiner: 'An interactive slow-living landing page set in a serene garden, using a foggy-glass interaction where visitors clear the mist to reveal the view beyond.',
          type: 'Experimental Web Experience',
          role: 'Product Designer',
          route: 'slow-garden.html',
          slotId: 'ei-slow-garden',
          placeholderLabel: 'Drop cover image — The Slow Garden'
        },
        {
          number: '02',
          title: 'Focus Ritual',
          oneLiner: 'A working Pomodoro timer prototype exploring how a focus tool can feel calm, tactile, and a little brutalist — three interaction directions to choose from.',
          type: 'Interactive Prototype',
          role: 'Product Designer',
          route: 'pomodoro.html',
          slotId: 'ei-pomodoro',
          placeholderLabel: 'Drop cover image — Focus Ritual'
        }
      ]
    };
  }
}

</script>
</body>
</html>
