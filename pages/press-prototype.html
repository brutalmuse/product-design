<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../js/support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<style>
html,body{margin:0;padding:0;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
@media (prefers-reduced-motion: reduce){*{transition-duration:0.001ms !important;animation-duration:0.001ms !important}}
a{color:oklch(0.75 0.22 40)}
a:hover{color:oklch(0.6 0.2 40)}
</style>
</helmet>
<div style="height:100vh;width:100%;background:oklch(0.985 0.002 90);display:flex;flex-direction:column;font-family:Helvetica,Arial,sans-serif;color:oklch(0.12 0 0);overflow:hidden;box-sizing:border-box;position:relative">

<video ref="{{ videoRef }}" autoplay="{{ true }}" muted="{{ true }}" loop="{{ true }}" playsinline="{{ true }}" src="../assets/video/vibrate.webm" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0"></video>

<div style="display:flex;justify-content:flex-end;padding:32px 40px 0;flex-shrink:0;position:relative;z-index:1">
<div style="font-size:11px;color:oklch(0.2 0 0);letter-spacing:.06em;text-transform:uppercase;background:oklch(1 0 0 / 0.35);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);border:1px solid oklch(1 0 0 / 0.5);border-radius:999px;padding:6px 14px;box-shadow:0 4px 16px oklch(0.12 0 0 / 0.08)">{{ indexLabel }}</div>
</div>

<div style="display:flex;flex:1;min-height:0;position:relative;z-index:1">
<div onMouseMove="{{ stageMouseMove }}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:9vh;gap:16px;position:relative">
<div style="font-size:15px;font-weight:300;letter-spacing:.04em;color:oklch(0.4 0 0)">{{ currentWord }}</div>
<div style="display:flex;justify-content:center;flex-wrap:wrap;gap:4px;background:oklch(1 0 0 / 0.32);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border:1px solid oklch(1 0 0 / 0.5);border-radius:999px;padding:6px;box-shadow:0 8px 24px oklch(0.12 0 0 / 0.1)">
<sc-for list="{{ navItems }}" as="navItem" hint-placeholder-count="12">
<div onClick="{{ navItem.onClick }}" title="{{ navItem.word }}" style="{{ navItem.itemStyle }}">
<svg viewBox="0 0 24 24" width="18" height="18">
<path d="{{ navItem.iconPath }}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
<sc-if value="{{ navItem.hasDot }}" hint-placeholder-val="{{ false }}">
<circle cx="{{ navItem.dotCx }}" cy="{{ navItem.dotCy }}" r="{{ navItem.dotR }}" fill="currentColor"></circle>
</sc-if>
</svg>
</div>
</sc-for>
</div>
<div style="position:relative;display:flex;align-items:center;justify-content:center;margin-top:8px">
<sc-if value="{{ isCelebrate }}" hint-placeholder-val="{{ false }}">
<sc-for list="{{ particles }}" as="p" hint-placeholder-count="8">
<div style="{{ p.style }}"></div>
</sc-for>
</sc-if>
<button type="button" ref="{{ buttonRef }}" onMouseDown="{{ onDown }}" onMouseUp="{{ onUp }}" onMouseLeave="{{ onUp }}" onClick="{{ onClickBtn }}" onMouseEnter="{{ onEnter }}" style="{{ buttonStyle }}">{{ buttonLabel }}</button>
</div>
<div style="font-size:12px;color:oklch(0.12 0 0);min-height:18px">{{ caption }}</div>
<sc-if value="{{ hasExtraLink }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ extraLinkOnClick }}" style="font-size:11px;color:oklch(0.12 0 0);text-decoration:underline;cursor:pointer;letter-spacing:.05em;text-transform:uppercase">{{ extraLinkText }}</div>
</sc-if>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const BEHAVIORS = [
  {key:'hesitate', label:'Hesitate'},
  {key:'commit', label:'Commit'},
  {key:'urgent', label:'Urgent'},
  {key:'undo', label:'Undo'},
  {key:'danger', label:'Danger'},
  {key:'celebrate', label:'Celebrate'},
  {key:'wait', label:'Wait'},
  {key:'quiet', label:'Quiet'},
  {key:'heavy', label:'Heavy'},
  {key:'fragile', label:'Fragile'},
  {key:'curious', label:'Curious'},
  {key:'done', label:'Done'},
];
const CELEBRATE_ANGLES = [0,45,90,135,180,225,270,315];
const NAV_ICONS = {
  hesitate: { path: 'M4 8l4 4-4 4M11 8l4 4-4 4' },
  commit: { path: 'M12 3l9 9-9 9-9-9z', hasDot: true, dotCx: 12, dotCy: 12, dotR: 2.4 },
  urgent: { path: 'M12 4l9 16H3zM12 9v4', hasDot: true, dotCx: 12, dotCy: 16, dotR: 1.2 },
  undo: { path: 'M9 8L4 12l5 4M4 12h9a5 5 0 100-10' },
  danger: { path: 'M8 3h8l5 5v8l-5 5H8l-5-5V8zM12 8v5', hasDot: true, dotCx: 12, dotCy: 16, dotR: 1.2 },
  celebrate: { path: 'M12 3v5M12 16v5M3 12h5M16 12h5' },
  wait: { path: 'M6 3h12M6 21h12M6 3l6 9-6 9M18 3l-6 9 6 9' },
  quiet: { path: '', hasDot: true, dotCx: 12, dotCy: 12, dotR: 2 },
  heavy: { path: 'M4 12h16M4 9v6M20 9v6M7 7v10M17 7v10' },
  fragile: { path: 'M4 4h16v16H4zM9 4l2 6-3 2 3 6' },
  curious: { path: 'M9 8a3 3 0 116 0c0 2-3 2-3 5', hasDot: true, dotCx: 12, dotCy: 19, dotR: 1.2 },
  done: { path: 'M4 13l5 5L20 6' },
};
const INK = 'oklch(0.12 0 0)';
const OFFWHITE = 'oklch(0.985 0.002 90)';
const ACCENT = 'oklch(0.6 0.19 250 / 0.6)';
const DANGER = 'oklch(0.5 0.19 25 / 0.6)';
const INK_SOFT = 'oklch(0.3 0 0 / 0.55)';

class Component extends DCLogic {
  buttonRef = React.createRef();
  videoRef = React.createRef();
  timers = [];
  _rafPending = false;
  _lastMove = null;

  getInitialEphemeral() {
    return {
      hesitateOffset:0, hesitateDodged:false, hesitatePressed:false,
      commitProgress:0, commitHeld:false, commitSuccess:false,
      urgentNeglect:0, urgentCalmed:false,
      undoPhase:'idle',
      dangerArmed:false, dangerOffset:0, dangerDone:false,
      celebrateExploded:false, celebrateDone:false,
      waitProcessing:false, waitDone:false,
      quietProximity:0, quietFound:false,
      heavyProgress:0, heavyHeld:false, heavyDone:false, heavyJitter:0,
      fragileJolt:false, fragileHandled:false,
      curiousVariant:0, curiousChosen:false,
      doneTransformed:false,
    };
  }

  state = { active: 0, ...this.getInitialEphemeral() };

  componentDidMount() {
    if (BEHAVIORS[this.state.active].key === 'urgent') this.startUrgent();
    const v = this.videoRef.current;
    if (v) {
      v.autoplay = true;
      v.muted = true;
      v.loop = true;
      v.defaultMuted = true;
      const tryPlay = () => v.play().catch(() => {});
      tryPlay();
      v.addEventListener('pause', tryPlay);
      v.addEventListener('ended', tryPlay);
      const id = setInterval(() => { if (v.paused) tryPlay(); }, 1000);
      this.timers.push(id);
    }
  }
  componentWillUnmount() {
    this.clearAllTimers();
  }
  clearAllTimers() {
    this.timers.forEach(id => clearTimeout(id));
    this.timers = [];
  }
  startUrgent() {
    const id = setInterval(() => {
      this.setState(s => s.urgentNeglect < 30 ? { urgentNeglect: s.urgentNeglect + 1 } : null);
    }, 350);
    this.timers.push(id);
  }

  select(i) {
    this.clearAllTimers();
    this.setState({ ...this.getInitialEphemeral(), active: i });
    if (BEHAVIORS[i].key === 'urgent') this.startUrgent();
  }

  onDown = () => {
    const key = BEHAVIORS[this.state.active].key;
    if (key === 'commit') this.commitDown();
    else if (key === 'heavy') this.heavyDown();
    else if (key === 'hesitate') this.hesitateDown();
    else if (key === 'danger') this.dangerDown();
  };
  onUp = () => {
    const key = BEHAVIORS[this.state.active].key;
    if (key === 'commit') this.commitUp();
    else if (key === 'heavy') this.heavyUp();
  };
  onEnter = () => {
    if (BEHAVIORS[this.state.active].key === 'curious') this.curiousEnter();
  };
  onClickBtn = () => {
    const key = BEHAVIORS[this.state.active].key;
    if (key === 'hesitate') this.hesitateClick();
    else if (key === 'urgent') this.urgentClick();
    else if (key === 'undo') this.undoClick();
    else if (key === 'danger') this.dangerClick();
    else if (key === 'celebrate') this.celebrateClick();
    else if (key === 'wait') this.waitClick();
    else if (key === 'quiet') this.quietClick();
    else if (key === 'fragile') this.fragileClick();
    else if (key === 'curious') this.curiousClick();
    else if (key === 'done') this.doneClick();
  };

  hesitateDown() {
    if (!this.state.hesitateDodged) {
      const dir = Math.random() > 0.5 ? 1 : -1;
      const off = dir * (50 + Math.random() * 30);
      this.setState({ hesitateOffset: off });
      const id = setTimeout(() => this.setState({ hesitateOffset: 0, hesitateDodged: true }), 220);
      this.timers.push(id);
    }
  }
  hesitateClick() {
    if (this.state.hesitateDodged) {
      this.setState({ hesitatePressed: true });
      const id = setTimeout(() => this.setState({ hesitateDodged: false, hesitatePressed: false }), 1000);
      this.timers.push(id);
    }
  }

  commitDown() {
    if (this.state.commitHeld) return;
    this.setState({ commitHeld: true });
    const id = setInterval(() => {
      this.setState(s => {
        const p = Math.min(100, s.commitProgress + 100 / 30);
        if (p >= 100) {
          clearTimeout(id);
          const t = setTimeout(() => this.setState({ commitProgress: 0, commitHeld: false, commitSuccess: false }), 900);
          this.timers.push(t);
          return { commitProgress: 100, commitSuccess: true, commitHeld: false };
        }
        return { commitProgress: p };
      });
    }, 40);
    this.timers.push(id);
  }
  commitUp() {
    if (this.state.commitProgress < 100) {
      this.clearAllTimers();
      this.setState({ commitProgress: 0, commitHeld: false });
    }
  }

  heavyDown() {
    if (this.state.heavyHeld) return;
    this.setState({ heavyHeld: true });
    const id = setInterval(() => {
      this.setState(s => {
        const p = Math.min(100, s.heavyProgress + 100 / 45);
        const jitter = (1 - p / 100) * 6 * Math.sin(p * 0.9);
        if (p >= 100) {
          clearTimeout(id);
          const t = setTimeout(() => this.setState({ heavyProgress: 0, heavyHeld: false, heavyDone: false, heavyJitter: 0 }), 900);
          this.timers.push(t);
          return { heavyProgress: 100, heavyDone: true, heavyHeld: false, heavyJitter: 0 };
        }
        return { heavyProgress: p, heavyJitter: jitter };
      });
    }, 40);
    this.timers.push(id);
  }
  heavyUp() {
    if (this.state.heavyProgress < 100) {
      this.clearAllTimers();
      this.setState({ heavyProgress: 0, heavyHeld: false, heavyJitter: 0 });
    }
  }

  dangerDown() {
    const off = (Math.random() > 0.5 ? 1 : -1) * (8 + Math.random() * 8);
    this.setState({ dangerOffset: off });
    const id = setTimeout(() => this.setState({ dangerOffset: 0 }), 160);
    this.timers.push(id);
  }
  dangerClick() {
    if (!this.state.dangerArmed) {
      this.setState({ dangerArmed: true });
      const id = setTimeout(() => this.setState({ dangerArmed: false }), 2600);
      this.timers.push(id);
    } else {
      this.setState({ dangerArmed: false, dangerDone: true });
      const t = setTimeout(() => this.setState({ dangerDone: false }), 900);
      this.timers.push(t);
    }
  }

  urgentClick() {
    this.setState({ urgentNeglect: 0, urgentCalmed: true });
    const id = setTimeout(() => this.setState({ urgentCalmed: false }), 700);
    this.timers.push(id);
  }

  undoClick() {
    if (this.state.undoPhase === 'idle') {
      this.setState({ undoPhase: 'forward' });
      const id = setTimeout(() => this.setState({ undoPhase: 'forwardDone' }), 500);
      this.timers.push(id);
    }
  }
  undoReverse = () => {
    if (this.state.undoPhase === 'forwardDone') {
      this.setState({ undoPhase: 'reverse' });
      const id = setTimeout(() => this.setState({ undoPhase: 'idle' }), 500);
      this.timers.push(id);
    }
  };

  celebrateClick() {
    if (this.state.celebrateExploded || this.state.celebrateDone) return;
    this.setState({ celebrateExploded: true });
    const id = setTimeout(() => {
      this.setState({ celebrateExploded: false, celebrateDone: true });
      const t = setTimeout(() => this.setState({ celebrateDone: false }), 750);
      this.timers.push(t);
    }, 650);
    this.timers.push(id);
  }

  waitClick() {
    if (this.state.waitProcessing || this.state.waitDone) return;
    this.setState({ waitProcessing: true });
    const id = setTimeout(() => {
      this.setState({ waitProcessing: false, waitDone: true });
      const t = setTimeout(() => this.setState({ waitDone: false }), 800);
      this.timers.push(t);
    }, 1400);
    this.timers.push(id);
  }

  quietClick() {
    this.setState({ quietFound: true });
    const id = setTimeout(() => this.setState({ quietFound: false }), 700);
    this.timers.push(id);
  }

  fragileClick() {
    this.setState({ fragileHandled: true });
    const id = setTimeout(() => this.setState({ fragileHandled: false }), 700);
    this.timers.push(id);
  }

  curiousEnter() {
    this.setState(s => ({ curiousVariant: (s.curiousVariant + 1) % 6 }));
  }
  curiousClick() {
    this.setState({ curiousChosen: true });
    const id = setTimeout(() => this.setState({ curiousChosen: false }), 700);
    this.timers.push(id);
  }

  doneClick() {
    if (!this.state.doneTransformed) this.setState({ doneTransformed: true });
  }
  resetDone = () => this.setState({ doneTransformed: false });

  stageMouseMove = (e) => {
    const key = BEHAVIORS[this.state.active].key;
    if (key !== 'quiet' && key !== 'fragile') return;
    const btn = this.buttonRef.current;
    if (!btn) return;
    const rect = btn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    const dx = e.clientX - cx, dy = e.clientY - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (key === 'quiet') {
      const proximity = Math.max(0, Math.min(1, 1 - dist / 380));
      if (!this._rafPending) {
        this._rafPending = true;
        requestAnimationFrame(() => {
          this._rafPending = false;
          this.setState({ quietProximity: proximity });
        });
      }
    } else if (key === 'fragile') {
      const now = performance.now();
      if (this._lastMove) {
        const dt = Math.max(now - this._lastMove.t, 1);
        const speed = Math.sqrt((e.clientX - this._lastMove.x) ** 2 + (e.clientY - this._lastMove.y) ** 2) / dt;
        if (speed > 1.6 && dist < 260 && !this.state.fragileJolt) {
          this.setState({ fragileJolt: true });
          const id = setTimeout(() => this.setState({ fragileJolt: false }), 320);
          this.timers.push(id);
        }
      }
      this._lastMove = { x: e.clientX, y: e.clientY, t: now };
    }
  };

  computeButtonStyle(key, s) {
    const base = {
      minWidth: '260px', height: '92px', padding: '0 36px', borderRadius: '999px',
      background: INK, color: OFFWHITE, border: '1px solid oklch(1 0 0 / 0.3)', fontFamily: 'Helvetica,Arial,sans-serif',
      fontWeight: 500, fontSize: '16px', letterSpacing: '.05em', textTransform: 'uppercase',
      cursor: 'pointer', transition: 'transform .32s cubic-bezier(.2,.8,.2,1), background .3s, color .3s, opacity .35s, border-radius .3s, box-shadow .3s, width .3s',
      boxShadow: '0 18px 40px oklch(0.12 0 0 / 0.3), inset 0 1px 0 oklch(1 0 0 / 0.25)', outline: 'none', userSelect: 'none',
      backdropFilter: 'blur(18px) saturate(180%)', WebkitBackdropFilter: 'blur(18px) saturate(180%)', border: '1px solid oklch(1 0 0 / 0.35)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', boxSizing: 'border-box',
    };
    switch (key) {
      case 'hesitate':
        return { ...base, transform: `translateX(${s.hesitateOffset}px) scale(${s.hesitatePressed ? 0.96 : 1})` };
      case 'commit':
        return { ...base, background: `linear-gradient(90deg,${ACCENT} ${s.commitProgress}%, ${INK} ${s.commitProgress}%)`, transform: `scale(${s.commitHeld ? 0.98 : 1})` };
      case 'urgent': {
        const n = s.urgentNeglect;
        const scale = 1 + Math.min(n, 30) * 0.006;
        const glow = Math.min(n, 30) * 3;
        const hot = n > 18;
        return { ...base, background: hot ? ACCENT : INK, color: hot ? 'oklch(0.12 0 0)' : OFFWHITE, transform: `scale(${s.urgentCalmed ? 0.94 : scale})`, boxShadow: `0 0 ${glow}px oklch(0.6 0.19 250 / ${Math.min(n / 30, 1) * 0.8}), 0 18px 40px oklch(0.12 0 0 / 0.16), inset 0 1px 0 oklch(1 0 0 / 0.35)` };
      }
      case 'undo': {
        const t = (s.undoPhase === 'forward' || s.undoPhase === 'forwardDone') ? 'translateX(70px) rotate(8deg)' : 'translateX(0) rotate(0deg)';
        return { ...base, transform: t, transition: base.transition + (s.undoPhase === 'reverse' ? ', transform .5s cubic-bezier(.34,1.56,.64,1)' : '') };
      }
      case 'danger':
        return { ...base, background: s.dangerArmed ? DANGER : INK, transform: `translateX(${s.dangerOffset}px)`, boxShadow: s.dangerArmed ? '0 18px 40px oklch(0.5 0.19 25 / 0.35)' : base.boxShadow };
      case 'celebrate':
        return { ...base, transform: `scale(${s.celebrateExploded ? 1.15 : 1})`, opacity: s.celebrateExploded ? 0.3 : 1, background: s.celebrateDone ? ACCENT : INK, color: s.celebrateDone ? 'oklch(0.12 0 0)' : OFFWHITE };
      case 'wait':
        return { ...base, transform: `scaleY(${s.waitProcessing ? 0.42 : 1})`, background: s.waitDone ? ACCENT : INK, color: s.waitDone ? 'oklch(0.12 0 0)' : OFFWHITE };
      case 'quiet':
        return { ...base, opacity: 0.05 + s.quietProximity * 0.95, boxShadow: 'none' };
      case 'heavy':
        return { ...base, transform: `translateX(${s.heavyJitter || 0}px) scale(${s.heavyHeld ? 0.97 : 1})`, background: `linear-gradient(90deg,${INK_SOFT} ${s.heavyProgress}%, ${INK} ${s.heavyProgress}%)` };
      case 'fragile':
        return { ...base, transform: s.fragileJolt ? 'scale(0.9) rotate(-3deg)' : 'scale(1) rotate(0deg)', background: s.fragileJolt ? DANGER : INK };
      case 'curious': {
        const variants = [
          { bg: INK, text: OFFWHITE, r: '999px' },
          { bg: 'oklch(0.5 0.1 200 / 0.55)', text: OFFWHITE, r: '40px' },
          { bg: ACCENT, text: 'oklch(0.12 0 0)', r: '999px' },
          { bg: 'oklch(0.45 0.12 300 / 0.55)', text: OFFWHITE, r: '20px' },
          { bg: INK, text: OFFWHITE, r: '70px 999px' },
          { bg: 'oklch(0.5 0.12 90 / 0.55)', text: OFFWHITE, r: '999px' },
        ];
        const v = variants[s.curiousVariant % variants.length];
        return { ...base, background: v.bg, color: v.text, borderRadius: v.r, border: v.text === 'oklch(0.12 0 0)' ? '1px solid oklch(0.12 0 0 / 0.2)' : base.border };
      }
      case 'done':
        return { ...base, borderRadius: s.doneTransformed ? '24px' : '999px', background: s.doneTransformed ? ACCENT : INK, color: s.doneTransformed ? 'oklch(0.12 0 0)' : OFFWHITE, minWidth: s.doneTransformed ? '160px' : base.minWidth };
      default:
        return base;
    }
  }

  computeButtonLabel(key, s) {
    if (key === 'done') return s.doneTransformed ? 'Done' : 'Press';
    if (key === 'danger') return s.dangerDone ? 'Deleted' : s.dangerArmed ? 'Confirm?' : 'Press';
    if (key === 'wait') return s.waitDone ? 'Done' : s.waitProcessing ? '' : 'Press';
    if (key === 'celebrate') return s.celebrateDone ? 'Done!' : 'Press';
    if (key === 'heavy') return s.heavyDone ? 'Lifted' : 'Press';
    return 'Press';
  }

  computeCaption(key, s) {
    switch (key) {
      case 'hesitate': return s.hesitatePressed ? 'there we go.' : s.hesitateDodged ? 'not yet.' : 'go on, then.';
      case 'commit': return s.commitSuccess ? 'locked in.' : s.commitHeld ? "don't let go." : 'hold to commit.';
      case 'urgent': return s.urgentNeglect > 0 ? (s.urgentCalmed ? 'noted.' : `still waiting (${s.urgentNeglect})`) : 'try ignoring this.';
      case 'undo': return s.undoPhase === 'idle' ? 'do something.' : s.undoPhase === 'forward' ? 'done.' : s.undoPhase === 'forwardDone' ? 'having second thoughts?' : 'as if it never happened.';
      case 'danger': return s.dangerDone ? 'gone.' : s.dangerArmed ? 'sure about that?' : "this one's permanent.";
      case 'celebrate': return s.celebrateDone ? 'not bad.' : s.celebrateExploded ? 'showing off.' : 'earn it first.';
      case 'wait': return s.waitDone ? 'there.' : s.waitProcessing ? 'thinking.' : 'no spinner here.';
      case 'quiet': return s.quietFound ? 'caught you looking.' : s.quietProximity > 0.5 ? 'closer.' : "you'll have to find it.";
      case 'heavy': return s.heavyDone ? 'that took effort.' : s.heavyHeld ? 'still going.' : 'this one pushes back.';
      case 'fragile': return s.fragileJolt ? 'careful.' : s.fragileHandled ? 'appreciated.' : 'slow hands only.';
      case 'curious': return s.curiousChosen ? `variant ${s.curiousVariant + 1}, for now` : 'keeps changing its mind.';
      case 'done': return s.doneTransformed ? "that's it. that's the result." : 'see what happens.';
      default: return '';
    }
  }

  renderVals() {
    const s = this.state;
    const key = BEHAVIORS[s.active].key;
    const navItems = BEHAVIORS.map((b, i) => {
      const icon = NAV_ICONS[b.key];
      return {
        word: b.label,
        onClick: () => this.select(i),
        iconPath: icon.path, hasDot: !!icon.hasDot, dotCx: icon.dotCx, dotCy: icon.dotCy, dotR: icon.dotR,
        itemStyle: {
          width: '38px', height: '38px', borderRadius: '999px', display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: 'pointer', background: i === s.active ? 'oklch(0.3 0 0 / 0.12)' : 'transparent',
          color: i === s.active ? 'oklch(0.25 0 0)' : 'oklch(0.4 0 0)', transition: 'background .2s, color .2s',
        },
      };
    });
    const particles = CELEBRATE_ANGLES.map(a => {
      const rad = a * Math.PI / 180;
      const dist = s.celebrateExploded ? 110 : 0;
      const x = Math.cos(rad) * dist, y = Math.sin(rad) * dist;
      return {
        style: {
          position: 'absolute', left: '50%', top: '50%', width: '10px', height: '10px', borderRadius: '50%',
          background: ACCENT, transform: `translate(${x - 5}px, ${y - 5}px)`, opacity: s.celebrateExploded ? 1 : 0,
          transition: 'transform .6s cubic-bezier(.2,.8,.2,1), opacity .6s', pointerEvents: 'none',
        },
      };
    });
    return {
      navItems,
      currentWord: BEHAVIORS[s.active].label.toUpperCase(),
      indexLabel: String(s.active + 1).padStart(2, '0') + ' / 12',
      buttonStyle: this.computeButtonStyle(key, s),
      buttonLabel: this.computeButtonLabel(key, s),
      caption: this.computeCaption(key, s),
      hasExtraLink: (key === 'undo' && s.undoPhase === 'forwardDone') || (key === 'done' && s.doneTransformed),
      extraLinkText: key === 'undo' ? 'undo this' : 'reset',
      extraLinkOnClick: key === 'undo' ? this.undoReverse : this.resetDone,
      isCelebrate: key === 'celebrate',
      particles,
      buttonRef: this.buttonRef,
      stageMouseMove: this.stageMouseMove,
      onDown: this.onDown, onUp: this.onUp, onClickBtn: this.onClickBtn, onEnter: this.onEnter,
      videoRef: this.videoRef,
    };
  }
}
</script>
</body>
